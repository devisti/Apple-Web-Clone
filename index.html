<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Web Layout | Isti Hoque</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-container">
        <div class="navbar1">
            <div class="apple-logo-wrapper">
                <a href="https://www.apple.com/in/">
                    <img class="apple-logo" src="images/Apple-logo.png" alt="Apple logo">
                </a>
            </div>
            <ul>
                <li><a href="https://www.apple.com/in/mac/">Mac</a></li>
                <li><a href="">Ipad</a></li>
                <li><a href="">Iphone</a></li>
                <li><a href="">Watch</a></li>
                <li><a href="">TV</a></li>
                <li><a href="">Music</a></li>
                <li><a href="">Support</a></li>
            </ul>
            <div class="shop-logo-wrapper">
                <a href="">
                    <img class="shop-logo" src="images/shop-logo.png" alt="shop logo">
                </a>
                <a class="sec-shop-logo-gapping" href="">
                    <img class="shop-logo" src="images/shop-logo.png" alt="shop logo">
                </a>
            </div>
        </div>

        <div class="navbar2">
            <h2><a href="">iPhone 12 Pro</a></h2>
            <a class="navbar2-elements" href="">Overview</a>
            <a class="navbar2-elements" href="">Tech Specs</a>
            <a class="buy-container" href="">Buy</a>
        </div>


        <img class="image-1" src="images/iphone-12pro.png" alt="">
        <video class="video-1" src="videos/demo-video.mp4" autoplay loop muted></video>
        <img class="image-2" src="images/Apple_iPhone13_LEAD.jpg" alt="">
        <video class="video-2" src="videos/apple_demo-video.mp4" autoplay loop muted></video>

        <div class="footer">
            <h1>
                Designed By Isti
            </h1>
        </div>
    </div>
    <!-- below items are fixed logos -->
    <img src="https://avatars.githubusercontent.com/u/115354997?s=400&u=b2fda848bc15246768d8f8c07c62dbe0f5996be2&v=4"
        alt="Isti's profile img" class="fixed-isti" style="color: white;">
    <div class="fixed-name">
        <h3>Isti Hoque</h3>
    </div>
    </div>

</html>
